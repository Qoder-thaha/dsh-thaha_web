 <title> bulb on and off </title>
</head>
<body>
     <button onclick="turnon()"> Turn on the light</button>
     <img id="myImage" src="bulboff.jpg" width="100px">
     <button onclick="turnoff()"> Turn off the light</button>
      <script>
          function turnon(){
          document.getElementById("myImage").src="bulbon.jpg";
           }
          
          function turnoff(){
          document.getElementById("myImage").src="bulboff.jpg";
           }
      </script>
</body>
